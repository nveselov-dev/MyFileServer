<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Изменение пароля</title>
</head>
<body>
<h1>Изменение пароля</h1>

<form method="POST" action="/change-password">
  <p>
    <label>Текущий пароль:<br>
      <input type="password" name="oldPassword" required></label>
  </p>
  <p>
    <label>Новый пароль:<br>
      <input type="password" name="newPassword" required></label>
  </p>
  <p>
    <label>Подтвердите новый пароль:<br>
      <input type="password" name="confirmNewPassword" required></label>
  </p>
  <p>
    <button type="submit">Изменить пароль</button>
  </p>
</form>

<p><a href="/">На главную</a></p>
</body>
</html>
