<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Изменение пароля</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 50px auto;
      padding: 20px;
    }
    nav {
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #ccc;
    }
    nav a {
      margin-right: 10px;
      text-decoration: none;
      color: #007bff;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #0056b3;
    }
    .back-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #666;
      text-decoration: none;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
<nav>
  <a href="/">Файлы</a> |
  <a href="/weather">Погода</a> |
  <a href="/cat">Котик</a> |
  <a href="/jokes">Анекдоты</a> |
  <a href="/logout">Выход</a>
</nav>

<h1>Изменение пароля</h1>

<form method="POST" action="/change-password">
  <div class="form-group">
    <label for="oldPassword">Текущий пароль:</label>
    <input type="password" id="oldPassword" name="oldPassword" required>
  </div>

  <div class="form-group">
    <label for="newPassword">Новый пароль:</label>
    <input type="password" id="newPassword" name="newPassword" required minlength="6">
  </div>

  <div class="form-group">
    <label for="confirmNewPassword">Подтвердите новый пароль:</label>
    <input type="password" id="confirmNewPassword" name="confirmNewPassword" required minlength="6">
  </div>

  <button type="submit">Изменить пароль</button>
</form>

<a href="/" class="back-link">← На главную</a>
</body>
</html>
